<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração - Cadastro de Colaboradores</title>
    <link rel="stylesheet" href="styles-admin.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1>🔐 Administração - Cadastro de Colaboradores</h1>
            <div>
                <a href="relatorios.html" class="btn-voltar-home">📊 Relatórios</a>
                <a href="../index.html" class="btn-voltar-home" style="margin-left: 10px;">← Voltar para Ponto</a>
            </div>
        </header>

        <div class="admin-content">
            <div class="card">
                <h2>Cadastrar Novo Colaborador</h2>
                <form id="form-colaborador" class="form-colaborador">
                    <div class="form-group">
                        <label for="nome-colaborador">Nome do Colaborador *</label>
                        <input type="text" id="nome-colaborador" required placeholder="Digite o nome completo">
                    </div>

                    <div class="form-group">
                        <label for="funcao-colaborador">Função *</label>
                        <input type="text" id="funcao-colaborador" required placeholder="Ex: Desenvolvedor, Gerente, etc.">
                    </div>

                    <div class="form-group">
                        <label for="senha-colaborador">Senha *</label>
                        <input type="password" id="senha-colaborador" required placeholder="Digite uma senha numérica" minlength="4" maxlength="10">
                        <small>Senha numérica (4 a 10 dígitos)</small>
                    </div>

                    <div class="form-group">
                        <label for="foto-colaborador">Foto de Perfil *</label>
                        <div class="upload-container">
                            <input type="file" id="foto-colaborador" accept="image/*" required>
                            <div class="preview-container">
                                <img id="preview-foto" src="" alt="Preview" style="display: none;">
                                <div class="preview-placeholder" id="preview-placeholder">
                                    <span>📷</span>
                                    <p>Nenhuma imagem selecionada</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Salvar Colaborador</button>
                        <button type="button" class="btn btn-secondary" id="btn-limpar-form">Limpar</button>
                    </div>
                </form>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Colaboradores Cadastrados</h2>
                    <button class="btn btn-secondary" id="btn-atualizar-lista">Atualizar Lista</button>
                </div>
                <div id="lista-colaboradores" class="lista-colaboradores"></div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
