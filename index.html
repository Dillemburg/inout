<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponto Eletrônico - Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Tela de Login com Teclado -->
    <div id="tela-login" class="tela-login">
        <div class="login-container">
            <div class="hora-display" id="hora-display"></div>
            
            <div class="senha-container">
                <div class="senha-label">Digite sua senha:</div>
                <div class="senha-input-container">
                    <input type="password" id="senha-input" class="senha-input" readonly placeholder="••••">
                    <button class="btn-limpar" id="btn-limpar">⌫</button>
                </div>
            </div>

            <div class="teclado-numerico">
                <button class="tecla" data-num="1">1</button>
                <button class="tecla" data-num="2">2</button>
                <button class="tecla" data-num="3">3</button>
                <button class="tecla" data-num="4">4</button>
                <button class="tecla" data-num="5">5</button>
                <button class="tecla" data-num="6">6</button>
                <button class="tecla" data-num="7">7</button>
                <button class="tecla" data-num="8">8</button>
                <button class="tecla" data-num="9">9</button>
                <button class="tecla btn-confirmar" id="btn-confirmar">✓</button>
                <button class="tecla" data-num="0">0</button>
                <button class="tecla btn-limpar-tecla" id="btn-limpar-tecla">⌫</button>
            </div>

            <div class="mensagem-erro" id="mensagem-erro"></div>
        </div>
    </div>

    <!-- Tela de Câmera -->
    <div id="tela-camera" class="tela-camera" style="display: none;">
        <div class="camera-header">
            <div class="camera-data-hora" id="camera-data-hora"></div>
            <div class="camera-nome" id="camera-nome"></div>
        </div>
        
        <div class="camera-container">
            <video id="video-camera" autoplay playsinline></video>
            <canvas id="canvas-camera" style="display: none;"></canvas>
        </div>

        <div class="camera-footer">
            <button class="btn-entrada-saida" id="btn-entrada-saida">
                <span id="btn-texto">Entrada</span>
            </button>
            <button class="btn-voltar" id="btn-voltar-camera">Voltar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
